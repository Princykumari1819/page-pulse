<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Pulse</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
        }

        input{
            width:75%;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            line-height:2;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Page Pulse</h1>

    <input
            type="text"
            id="url"
            placeholder="Enter Website URL">

    <button onclick="analyzePage()">
        Analyze
    </button>

    <div id="result"></div>

</div>

<script>

    async function analyzePage(){

        const url=document.getElementById("url").value;

        const response=await fetch("/analyze?url="+encodeURIComponent(url));

        const data=await response.json();

        document.getElementById("result").innerHTML=
            `
        <h2>Report</h2>

        <p><b>Status:</b> ${data.status}</p>

        <p><b>Response Time:</b> ${data.responseTime} ms</p>

        <p><b>Title:</b> ${data.title}</p>

        <p><b>Meta Description:</b> ${data.metaDescription}</p>

        <p><b>H1 Count:</b> ${data.h1Count}</p>

        <p><b>Image Count:</b> ${data.imageCount}</p>

        <p><b>Images Missing Alt Text:</b> ${data.altTextCount}</p>

        <p><b>Word Count:</b> ${data.wordCount}</p>
        `;

    }

</script>

</body>
</html>
